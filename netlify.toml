# Настройки сборки Netlify (можно не заполнять поля в UI — они берутся отсюда).
[build]
  command = "node scripts/gen-config.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# MCP-коннектор. Токен передаётся В ПУТИ: https://<сайт>/mcp/<токен>
# (claude.ai обрезает query-строку, поэтому ?t= не подходит).
[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp/:splat"
  status = 200
  force = true

# Без токена — только справка (список инструментов), запись невозможна.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
