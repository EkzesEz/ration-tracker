# Настройки сборки Netlify (можно не заполнять поля в UI — они берутся отсюда).
[build]
  command = "node scripts/gen-config.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Короткий адрес для MCP-коннектора: https://<сайт>/mcp?t=<токен>
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
